version: "3.9"
services:

  redis:
    image: redis
    ports:
      - 6379:6379
    networks:
      - myth-cloud
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - 5540:5540
    networks:
      - myth-cloud
    depends_on:
      - redis

volumes:
  redisinsight:
    driver: local
  redis:
    driver: local

networks:
  myth-cloud:
    driver: bridge
